<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfferFlow — 个人求职管理</title>
<style>
/* ========== CSS Variables & Reset ========== */
:root {
  --bg: #f1f5f9;
  --sidebar-bg: #0f172a;
  --sidebar-hover: #1e293b;
  --sidebar-active: #1e3a5f;
  --card: #ffffff;
  --card-border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-light: #eff6ff;
  --amber: #f59e0b;
  --amber-light: #fffbeb;
  --green: #22c55e;
  --green-light: #f0fdf4;
  --red: #ef4444;
  --red-light: #fef2f2;
  --purple: #8b5cf6;
  --purple-light: #f5f3ff;
  --slate: #64748b;
  --slate-light: #f8fafc;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.12);
  --transition: 180ms cubic-bezier(.4,0,.2,1);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono: "SF Mono","Fira Code","Fira Mono","Roboto Mono",monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:inherit;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit}
ul,ol{list-style:none}

/* ========== Sidebar ========== */
.sidebar {
  width: 220px; min-width: 220px; background: var(--sidebar-bg); color: #e2e8f0;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  z-index: 100; user-select: none;
}
.sidebar-brand {
  padding: 24px 20px 20px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-brand .logo {
  width: 34px; height: 34px; background: linear-gradient(135deg,var(--primary),var(--purple));
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
}
.sidebar-brand .name { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.sidebar-brand .name span { color: var(--primary); }
.sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px;
  border-radius: 8px; color: #94a3b8; font-size: 14px; font-weight: 500;
  transition: var(--transition); text-align: left;
}
.sidebar-nav button:hover { background: var(--sidebar-hover); color: #e2e8f0; }
.sidebar-nav button.active { background: var(--sidebar-active); color: #fff; }
.sidebar-nav button .icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
.sidebar-nav .badge {
  margin-left: auto; background: var(--primary); color: #fff; font-size: 11px;
  padding: 1px 7px; border-radius: 10px; font-weight: 600; min-width: 20px; text-align: center;
}
.sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: #475569; }

/* ========== Main ========== */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.content { padding: 24px 28px; flex: 1; overflow-y: auto; }

/* ========== Buttons ========== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px;
  font-size: 13.5px; font-weight: 600; transition: var(--transition); white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-md); }
.btn-outline { border: 1.5px solid var(--card-border); color: var(--text); background: var(--card); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { color: var(--text); background: #f1f5f9; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: var(--red-light); }

/* ========== Cards ========== */
.card {
  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  box-shadow: var(--shadow); transition: var(--transition);
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  padding: 16px 20px; border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header h3 { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }

/* ========== Status Badge ========== */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600; letter-spacing: .2px; white-space: nowrap;
}
.status-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.status-preparing { background: #f1f5f9; color: #475569; }
.status-preparing::before { background: #94a3b8; }
.status-applied { background: var(--primary-light); color: #1d4ed8; }
.status-applied::before { background: var(--primary); }
.status-screening { background: var(--purple-light); color: #6d28d9; }
.status-screening::before { background: var(--purple); }
.status-written_test { background: var(--amber-light); color: #b45309; }
.status-written_test::before { background: var(--amber); }
.status-interview { background: #ecfdf5; color: #047857; }
.status-interview::before { background: var(--green); }
.status-offer { background: #ecfdf5; color: #047857; }
.status-offer::before { background: var(--green); }
.status-rejected { background: var(--red-light); color: #b91c1c; }
.status-rejected::before { background: var(--red); }
.status-withdrawn { background: #f1f5f9; color: #64748b; }
.status-withdrawn::before { background: #94a3b8; }

/* ========== Job List ========== */
.job-list { display: flex; flex-direction: column; gap: 10px; }
.job-item {
  position: relative; display: flex; align-items: center; gap: 16px; padding: 16px 20px;
  cursor: pointer; border: 1px solid var(--card-border); border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow); transition: var(--transition);
}
.job-item:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.job-item .jp-company { font-size: 15px; font-weight: 600; color: var(--text); min-width: 140px; }
.job-item .jp-position { font-size: 14px; color: var(--text-secondary); min-width: 150px; }
.job-item .jp-status { flex-shrink: 0; }
.job-item .jp-meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.job-item .jp-date { font-size: 12px; color: var(--text-muted); }
.job-item .jp-next { font-size: 12px; color: var(--amber); font-weight: 500; }
.job-item .jp-arrow { color: var(--text-muted); font-size: 14px; flex-shrink: 0; }

.schedule-panel {
  margin-bottom: 20px; overflow: hidden; border-color: #c7d2fe;
  background: linear-gradient(180deg,#fff 0%,#f8faff 100%);
}
.schedule-panel .card-header { gap: 16px; flex-wrap: wrap; }
.schedule-title { display: flex; align-items: center; gap: 11px; min-width: 0; }
.schedule-mark {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: #fff; font-weight: 800; background: linear-gradient(135deg,#4f46e5,#7c3aed);
}
.schedule-title h3 { font-size: 15px; }
.schedule-title p { margin-top: 1px; font-size: 12px; color: var(--text-muted); }
.schedule-actions { display: flex; gap: 7px; margin-left: auto; flex-wrap: wrap; }
.schedule-frame-wrap { position: relative; min-height: 640px; background: #fff; }
.schedule-frame {
  display: block; width: 100%; height: 680px; border: 0; background: #fff;
}
.schedule-status {
  display: flex; align-items: center; gap: 7px; padding: 9px 16px;
  border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 11.5px;
}
.schedule-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.schedule-status.loaded .schedule-status-dot { background: var(--green); }
.schedule-fallback {
  display: none; padding: 32px 20px; text-align: center; color: var(--text-secondary);
}
.schedule-fallback strong { display: block; margin-bottom: 5px; color: var(--text); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; display: block; margin-bottom: 16px; opacity: .4; }
.empty-state h3 { font-size: 17px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: 13.5px; max-width: 320px; margin: 0 auto 16px; }

/* ========== Job Detail ========== */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.detail-full { grid-column: 1 / -1; }
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.detail-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.detail-header .meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.detail-actions { display: flex; gap: 8px; }

/* ========== Timeline ========== */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ""; position: absolute; left: 11px; top: 4px; bottom: 4px;
  width: 2px; background: var(--card-border); border-radius: 1px;
}
.timeline-item { position: relative; padding-bottom: 18px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before {
  content: ""; position: absolute; left: -21px; top: 6px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--card-border);
  border: 2px solid var(--card); z-index: 1;
}
.timeline-item.current::before { background: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
.timeline-item.past::before { background: var(--green); }
.timeline-item .tl-date { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.timeline-item .tl-status { font-size: 14px; font-weight: 600; margin: 2px 0; }
.timeline-item .tl-note { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* ========== Match Panel ========== */
.match-item {
  padding: 14px 16px; border-radius: 8px; margin-bottom: 8px;
  border-left: 3px solid transparent;
}
.match-item.direct { background: var(--green-light); border-left-color: var(--green); }
.match-item.adjacent { background: var(--amber-light); border-left-color: var(--amber); }
.match-item.missing { background: var(--red-light); border-left-color: var(--red); }
.match-item .match-label {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px;
}
.match-item.direct .match-label { background: #bbf7d0; color: #166534; }
.match-item.adjacent .match-label { background: #fde68a; color: #92400e; }
.match-item.missing .match-label { background: #fecaca; color: #991b1b; }
.match-item .match-jd { font-size: 13.5px; color: var(--text); font-weight: 500; margin-bottom: 4px; }
.match-item .match-resume { font-size: 13px; color: var(--text-secondary); }
.match-item .match-suggestion { font-size: 12.5px; color: var(--primary); margin-top: 6px; font-style: italic; }

/* ========== Self Intro ========== */
.intro-block {
  background: #f8fafc; border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 20px; line-height: 1.9; font-size: 14px; white-space: pre-wrap;
}
.intro-block .source {
  display: inline-block; font-size: 11px; color: var(--primary); background: var(--primary-light);
  padding: 1px 6px; border-radius: 4px; margin-left: 4px; cursor: help;
}

/* ========== Resume ========== */
.resume-editor { min-height: 300px; }
.resume-stats { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
.resume-version-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.resume-version-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border: 1px solid var(--card-border); border-radius: 8px;
  font-size: 13px; transition: var(--transition);
}
.resume-version-item:hover { border-color: var(--primary); }
.resume-upload {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px; margin-bottom: 14px; border: 1px dashed #93c5fd;
  border-radius: var(--radius); background: var(--primary-light);
}
.resume-upload-meta { min-width: 0; }
.resume-upload-meta strong { display: block; font-size: 14px; color: var(--text); }
.resume-upload-meta span { display: block; margin-top: 3px; font-size: 12px; color: var(--text-secondary); }
.resume-upload-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ========== Interview Studio ========== */
.interview-hero {
  padding: 22px; margin-bottom: 18px; border-radius: 14px;
  color: #e0e7ff; background: linear-gradient(125deg,#172554,#312e81 58%,#4c1d95);
  box-shadow: var(--shadow-md);
}
.interview-hero h2 { color: #fff; font-size: 20px; margin-bottom: 6px; }
.interview-hero p { max-width: 720px; font-size: 13px; color: #c7d2fe; }
.interview-toolbar { display: flex; gap: 10px; align-items: end; margin-top: 18px; flex-wrap: wrap; }
.interview-toolbar .form-group { flex: 1; min-width: 260px; margin: 0; }
.interview-toolbar label { color: #c7d2fe; }
.interview-grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(260px,.6fr); gap: 18px; }
.competency-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0 18px; }
.competency-chip { padding: 5px 10px; border-radius: 999px; background: var(--purple-light); color: #6d28d9; font-size: 12px; font-weight: 600; }
.question-card { border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 10px; }
.question-card.current { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.question-meta { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; font-size: 11px; color: var(--text-muted); }
.question-type { padding: 2px 7px; border-radius: 4px; color: #4338ca; background: #e0e7ff; font-weight: 700; }
.question-source { padding: 2px 7px; border-radius: 4px; color: #0369a1; background: #e0f2fe; font-weight: 700; }
.question-status { margin-left: auto; color: #92400e; }
.question-status.approved { color: #15803d; }
.question-text { font-size: 14px; font-weight: 600; line-height: 1.7; }
.question-probe { margin-top: 7px; color: var(--text-secondary); font-size: 12px; }
.question-evidence { margin-top: 10px; padding: 9px 11px; border-radius: 7px; background: #f8fafc; color: #475569; font-size: 12px; line-height: 1.6; }
.reference-answer { margin-top: 14px; border: 1px solid #c7d2fe; border-radius: 9px; background: #f5f7ff; overflow: hidden; }
.reference-answer summary { padding: 10px 12px; color: #4338ca; font-size: 13px; font-weight: 700; cursor: pointer; }
.reference-answer-content { padding: 0 12px 12px; white-space: pre-wrap; color: #334155; font-size: 13px; line-height: 1.75; }
.draft-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
.scorecard-row { padding: 10px 0; border-bottom: 1px solid var(--card-border); }
.scorecard-row:last-child { border-bottom: 0; }
.scorecard-row strong { display: block; font-size: 13px; margin-bottom: 3px; }
.scorecard-row span { font-size: 12px; color: var(--text-secondary); }
.coach-feedback { padding: 14px; margin-top: 12px; border-radius: 9px; background: #f8fafc; border-left: 3px solid var(--primary); }
.coach-feedback h4 { font-size: 13px; margin: 10px 0 4px; }
.coach-feedback h4:first-child { margin-top: 0; }
.coach-feedback p { font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; }

/* ========== Settings ========== */
.settings-section { margin-bottom: 28px; }
.settings-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.settings-section p { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 200;
  display: flex; align-items: center; justify-content: center; animation: fadeIn .15s;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lg);
  width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; animation: slideUp .2s;
}
.modal-header {
  padding: 18px 24px; border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card);
  border-radius: 14px 14px 0 0;
}
.modal-header h2 { font-size: 17px; font-weight: 700; }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 14px 24px; border-top: 1px solid var(--card-border); display: flex; gap: 8px;
  justify-content: flex-end; position: sticky; bottom: 0; background: var(--card);
  border-radius: 0 0 14px 14px;
}

/* ========== Form ========== */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
.form-group .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.form-input,.form-select,.form-textarea {
  width: 100%; padding: 9px 13px; border: 1.5px solid var(--card-border); border-radius: 8px;
  font-size: 14px; color: var(--text); background: var(--card); transition: var(--transition);
  outline: none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
.form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
.link-import {
  padding: 14px; margin-bottom: 18px; border: 1px solid #bfdbfe; border-radius: 10px;
  background: linear-gradient(135deg,#eff6ff 0%,#f8fafc 100%);
}
.link-import-row { display: flex; gap: 8px; align-items: stretch; }
.link-import-row .form-input { flex: 1; background: #fff; }
.parse-status {
  display: none; margin-top: 9px; padding: 8px 10px; border-radius: 7px;
  font-size: 12px; line-height: 1.5;
}
.parse-status.loading,.parse-status.info { display: block; background: #fff; color: #475569; border: 1px solid #dbeafe; }
.parse-status.success { display: block; background: var(--green-light); color: #166534; border: 1px solid #bbf7d0; }
.parse-status.error { display: block; background: var(--amber-light); color: #92400e; border: 1px solid #fde68a; }

/* ========== Toast ========== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-lg); animation: slideIn .25s; max-width: 360px;
  display: flex; align-items: center; gap: 8px;
}
.toast-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.toast-error { background: var(--red-light); color: #991b1b; border: 1px solid #fecaca; }
.toast-info { background: var(--primary-light); color: #1e40af; border: 1px solid #bfdbfe; }

/* ========== Filter Bar ========== */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-chip {
  padding: 5px 13px; border-radius: 20px; font-size: 12.5px; font-weight: 500;
  border: 1.5px solid var(--card-border); color: var(--text-secondary); transition: var(--transition);
}
.filter-chip:hover { border-color: var(--primary); color: var(--primary); }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ========== Stats Bar ========== */
.stats-bar {
  display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.stat-card {
  flex: 1; min-width: 120px; padding: 16px 20px; border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow);
}
.stat-card .stat-num { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
.stat-card .stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

/* ========== Animations ========== */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .sidebar { width: 60px; min-width: 60px; }
  .sidebar-brand .name { display: none; }
  .sidebar-nav button span:not(.icon) { display: none; }
  .sidebar-nav .badge { display: none; }
  .detail-grid { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .interview-grid { grid-template-columns: 1fr; }
  .resume-upload { align-items: flex-start; flex-direction: column; }
  .topbar { padding: 12px 16px; }
  .topbar { align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .topbar-actions { width: 100%; overflow-x: auto; padding-bottom: 2px; }
  .stats-bar { flex-direction: column; }
  .link-import-row { flex-direction: column; }
  .schedule-panel .card-header { align-items: flex-start; }
  .schedule-actions { width: 100%; margin-left: 0; }
  .schedule-actions .btn { flex: 1; justify-content: center; }
  .schedule-frame-wrap { min-height: 500px; }
  .schedule-frame { height: 540px; }
  .job-item { align-items: flex-start; gap: 8px; flex-wrap: wrap; padding: 14px; }
  .job-item .jp-company,.job-item .jp-position { min-width: 0; width: calc(100% - 28px); }
  .job-item .jp-meta { width: 100%; margin-left: 0; align-items: flex-start; }
  .job-item .jp-arrow { position: absolute; right: 16px; }
  .detail-tabs { overflow-x: auto; scrollbar-width: thin; }
  .detail-tab { flex: 0 0 auto; padding: 10px 13px; }
  .detail-header { gap: 12px; flex-direction: column; }
  .detail-actions { width: 100%; overflow-x: auto; }
}

@media (max-width: 420px) {
  .content { padding: 14px 12px; }
  .sidebar { width: 54px; min-width: 54px; }
  .sidebar-nav { padding-left: 7px; padding-right: 7px; }
  .sidebar-nav button { padding-left: 10px; padding-right: 10px; }
  .card-body { padding: 16px; }
  .modal { width: calc(100% - 20px); max-height: 92vh; }
  .modal-body { padding: 18px; }
  .schedule-frame { height: 500px; }
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ========== Section header ========== */
.section-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-top h2 { font-size: 18px; font-weight: 700; }

/* ========== Confirm dialog ========== */
.confirm-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 250; display: flex; align-items: center; justify-content: center; }
.confirm-box { background: var(--card); border-radius: 14px; padding: 24px; max-width: 400px; width: 90%; box-shadow: var(--shadow-lg); }
.confirm-box h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.confirm-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 18px; }
.confirm-box .actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Tabs inside detail */
.detail-tabs { display: flex; gap: 0; border-bottom: 1.5px solid var(--card-border); margin-bottom: 16px; }
.detail-tab {
  padding: 10px 18px; font-size: 13.5px; font-weight: 600; color: var(--text-muted);
  border-bottom: 2.5px solid transparent; transition: var(--transition); margin-bottom: -1.5px;
}
.detail-tab:hover { color: var(--text-secondary); }
.detail-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* JD highlight */
.jd-display { white-space: pre-wrap; line-height: 1.8; font-size: 13.5px; max-height: 400px; overflow-y: auto; padding: 14px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--card-border); }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="logo">O</div>
    <div class="name">Offer<span>Flow</span></div>
  </div>
  <nav class="sidebar-nav">
    <button data-view="list" class="active" onclick="navigate('list')">
      <span class="icon">&#x1F4CB;</span> <span>投递列表</span>
      <span class="badge" id="jobCount">0</span>
    </button>
    <button data-view="resume" onclick="navigate('resume')">
      <span class="icon">&#x1F4C4;</span> <span>我的简历</span>
    </button>
    <button data-view="interview" onclick="navigate('interview')">
      <span class="icon">&#x1F399;</span> <span>面试准备</span>
    </button>
    <button data-view="settings" onclick="navigate('settings')">
      <span class="icon">&#x2699;</span> <span>设置</span>
    </button>
  </nav>
  <div class="sidebar-footer">OfferFlow v0.5</div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar" id="topbar">
    <h1 id="pageTitle">投递列表</h1>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ========== OFFERFLOW APP ==========
const STORAGE_KEY = 'offerflow_data_v0.5';

const STATUS_MAP = {
  preparing:  { label: '准备投递', cls: 'status-preparing', icon: '○' },
  applied:    { label: '已投递',   cls: 'status-applied',   icon: '●' },
  screening:  { label: '简历筛选', cls: 'status-screening', icon: '◆' },
  written_test: { label: '笔试',   cls: 'status-written_test', icon: '◈' },
  interview_1:  { label: '一面',   cls: 'status-interview', icon: '▶' },
  interview_2:  { label: '二面',   cls: 'status-interview', icon: '▶' },
  interview_3:  { label: '三面',   cls: 'status-interview', icon: '▶' },
  hr_round:   { label: 'HR面',    cls: 'status-screening', icon: '◈' },
  offer:      { label: 'Offer',   cls: 'status-offer',      icon: '★' },
  rejected:   { label: '已拒绝',  cls: 'status-rejected',   icon: '✕' },
  withdrawn:  { label: '已放弃',  cls: 'status-withdrawn',  icon: '−' },
};

const STATUS_ORDER = ['preparing','applied','screening','written_test','interview_1','interview_2','interview_3','hr_round','offer','rejected','withdrawn'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(d) { if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('zh-CN',{month:'short',day:'numeric'}); }
function fmtFullDate(d) { if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'}); }
function now() { return new Date().toISOString(); }

// ========== State ==========
let state = {
  resume: { text: '', updatedAt: null, filename: '' },
  jobs: [],
  currentView: 'list',
  currentJobId: null,
  listFilter: 'all',
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.resume = d.resume || { text: '', updatedAt: null, filename: '' };
      state.jobs = d.jobs || [];
    }
  } catch(e) { console.warn('Failed to load state:', e); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ resume: state.resume, jobs: state.jobs }));
  } catch(e) { console.warn('Failed to save state:', e); toast('保存失败，存储空间可能已满', 'error'); }
}

// ========== Toast ==========
function toast(msg, type='info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2800);
}

// ========== Navigation ==========
function navigate(view, jobId=null) {
  state.currentView = view;
  state.currentJobId = jobId;
  document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-view="${view}"]`);
  if (btn) btn.classList.add('active');
  render();
}

// ========== Render ==========
function render() {
  switch(state.currentView) {
    case 'list': renderList(); break;
    case 'detail': renderDetail(); break;
    case 'resume': renderResume(); break;
    case 'interview': renderInterview(); break;
    case 'settings': renderSettings(); break;
  }
  document.getElementById('jobCount').textContent = state.jobs.filter(j=>j.status!=='rejected'&&j.status!=='withdrawn').length;
}

// ========== List View ==========
function renderList() {
  document.getElementById('pageTitle').textContent = '投递列表';
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-primary" onclick="openJobModal()">+ 添加岗位</button>
  `;

  const activeJobs = state.jobs.filter(j => j.status !== 'rejected' && j.status !== 'withdrawn');
  const archivedJobs = state.jobs.filter(j => j.status === 'rejected' || j.status === 'withdrawn');

  let filtered = state.listFilter === 'all' ? activeJobs : activeJobs.filter(j => j.status === state.listFilter);
  const statusCounts = {};
  activeJobs.forEach(j => { statusCounts[j.status] = (statusCounts[j.status]||0) + 1; });

  const activeStatuses = [...new Set(activeJobs.map(j=>j.status))].sort((a,b)=>STATUS_ORDER.indexOf(a)-STATUS_ORDER.indexOf(b));

  let html = '';

  // Stats
  html += `<div class="stats-bar">
    <div class="stat-card"><div class="stat-num">${activeJobs.length}</div><div class="stat-label">活跃岗位</div></div>
    <div class="stat-card"><div class="stat-num">${statusCounts.applied||0}</div><div class="stat-label">已投递</div></div>
    <div class="stat-card"><div class="stat-num">${(statusCounts.interview_1||0)+(statusCounts.interview_2||0)+(statusCounts.interview_3||0)+(statusCounts.hr_round||0)}</div><div class="stat-label">面试中</div></div>
    <div class="stat-card"><div class="stat-num">${statusCounts.offer||0}</div><div class="stat-label">Offer</div></div>
  </div>`;

  html += renderSchoolSchedule();

  // Filter
  html += `<div class="filter-bar">
    <button class="filter-chip ${state.listFilter==='all'?'active':''}" onclick="state.listFilter='all';renderList();">全部</button>`;
  activeStatuses.forEach(s => {
    html += `<button class="filter-chip ${state.listFilter===s?'active':''}" onclick="state.listFilter='${s}';renderList();">${STATUS_MAP[s].label} (${statusCounts[s]})</button>`;
  });
  html += `</div>`;

  // Job list
  if (filtered.length === 0) {
    html += `<div class="empty-state">
      <span class="icon">&#x1F4CB;</span>
      <h3>${state.listFilter==='all' ? '还没有岗位记录' : '该状态下没有岗位'}</h3>
      <p>添加你的第一个目标岗位，开始追踪求职进度</p>
      <button class="btn btn-primary" onclick="openJobModal()">+ 添加岗位</button>
    </div>`;
  } else {
    html += `<div class="job-list">`;
    filtered.forEach(job => {
      const st = STATUS_MAP[job.status] || STATUS_MAP.preparing;
      const nextStep = getNextStep(job);
      html += `<div class="job-item" onclick="navigate('detail','${job.id}')">
        <div class="jp-company">${esc(job.company)}</div>
        <div class="jp-position">${esc(job.position)}</div>
        <div class="jp-status"><span class="status-badge ${st.cls}">${st.label}</span></div>
        <div class="jp-meta">
          <span class="jp-date">${job.appliedDate ? '投递 '+fmtDate(job.appliedDate) : '创建 '+fmtDate(job.createdAt)}</span>
          ${nextStep ? `<span class="jp-next">${nextStep}</span>` : ''}
        </div>
        <span class="jp-arrow">→</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Archived
  if (archivedJobs.length > 0 && state.listFilter === 'all') {
    html += `<div style="margin-top:28px;"><h3 style="font-size:14px;color:var(--text-muted);margin-bottom:10px;font-weight:600;">已结束 (${archivedJobs.length})</h3>`;
    html += `<div class="job-list">`;
    archivedJobs.forEach(job => {
      const st = STATUS_MAP[job.status];
      html += `<div class="job-item" style="opacity:.6" onclick="navigate('detail','${job.id}')">
        <div class="jp-company">${esc(job.company)}</div>
        <div class="jp-position">${esc(job.position)}</div>
        <div class="jp-status"><span class="status-badge ${st.cls}">${st.label}</span></div>
        <div class="jp-meta"><span class="jp-date">${fmtDate(job.updatedAt)}</span></div>
        <span class="jp-arrow">→</span>
      </div>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function renderSchoolSchedule() {
  const expanded = state.scheduleExpanded !== false;
  return `<section class="card schedule-panel" aria-labelledby="scheduleTitle">
    <div class="card-header">
      <div class="schedule-title">
        <div class="schedule-mark">校</div>
        <div><h3 id="scheduleTitle">牛客校招日程</h3><p>集中查看企业网申、实习和校招时间</p></div>
      </div>
      <div class="schedule-actions">
        ${expanded ? `<button class="btn btn-outline btn-sm" onclick="refreshSchoolSchedule()">刷新</button>` : ''}
        <a class="btn btn-outline btn-sm" href="https://www.nowcoder.com/jobs/school/schedule" target="_blank" rel="noopener noreferrer">新标签页打开</a>
        <button class="btn btn-primary btn-sm" onclick="toggleSchoolSchedule()">${expanded ? '收起日程' : '展开日程'}</button>
      </div>
    </div>
    ${expanded ? `<div class="schedule-frame-wrap">
      <iframe class="schedule-frame" id="schoolScheduleFrame"
        src="https://www.nowcoder.com/jobs/school/schedule"
        title="牛客校招日程"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        onload="schoolScheduleLoaded()"></iframe>
      <div class="schedule-fallback" id="scheduleFallback">
        <strong>日程页面暂时无法嵌入</strong>
        <span>牛客可能限制了跨站展示，请使用“新标签页打开”。</span>
      </div>
    </div>
    <div class="schedule-status" id="scheduleStatus"><span class="schedule-status-dot"></span><span>正在连接牛客校招日程…</span></div>` : ''}
  </section>`;
}

function toggleSchoolSchedule() {
  state.scheduleExpanded = state.scheduleExpanded === false;
  renderList();
}

function refreshSchoolSchedule() {
  const frame = document.getElementById('schoolScheduleFrame');
  const status = document.getElementById('scheduleStatus');
  if (!frame) return;
  if (status) {
    status.classList.remove('loaded');
    status.querySelector('span:last-child').textContent = '正在重新加载牛客校招日程…';
  }
  frame.src = 'about:blank';
  setTimeout(() => { frame.src = 'https://www.nowcoder.com/jobs/school/schedule'; }, 80);
}

function schoolScheduleLoaded() {
  const frame = document.getElementById('schoolScheduleFrame');
  const status = document.getElementById('scheduleStatus');
  if (!frame || !status || frame.src === 'about:blank') return;
  status.classList.add('loaded');
  status.querySelector('span:last-child').textContent = '日程页面已加载；内容和登录状态由牛客提供。';
}

function getNextStep(job) {
  const tl = job.timeline || [];
  const last = tl[tl.length-1];
  if (last && last.nextStep) return '下一步: ' + last.nextStep;
  if (job.status === 'preparing') return '准备投递';
  return '';
}

// ========== Detail View ==========
function renderDetail() {
  const job = state.jobs.find(j => j.id === state.currentJobId);
  if (!job) { navigate('list'); return; }

  const st = STATUS_MAP[job.status] || STATUS_MAP.preparing;
  document.getElementById('pageTitle').textContent = job.company + ' · ' + job.position;
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-outline btn-sm" onclick="openJobModal('${job.id}')">编辑</button>
    <button class="btn btn-outline btn-sm" onclick="openStatusModal('${job.id}')">更新状态</button>
    <button class="btn btn-outline btn-sm btn-danger" onclick="confirmDeleteJob('${job.id}')">删除</button>
    <button class="btn btn-ghost btn-sm" onclick="navigate('list')">← 返回</button>
  `;

  let html = '';

  // Info card
  html += `<div class="card" style="margin-bottom:20px;"><div class="card-body">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div>
        <div style="font-size:20px;font-weight:700;">${esc(job.position)}</div>
        <div style="font-size:14px;color:var(--text-secondary);margin-top:2px;">${esc(job.company)}${job.location?' · '+esc(job.location):''}</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          <span class="status-badge ${st.cls}">${st.label}</span>
          ${job.channel ? `<span style="font-size:12px;color:var(--text-muted);">渠道: ${esc(job.channel)}</span>` : ''}
          ${job.appliedDate ? `<span style="font-size:12px;color:var(--text-muted);">投递: ${fmtFullDate(job.appliedDate)}</span>` : ''}
          ${job.deadline ? `<span style="font-size:12px;color:var(--red);">截止: ${fmtFullDate(job.deadline)}</span>` : ''}
        </div>
      </div>
      <div style="text-align:right;">
        ${job.jdLink ? `<a href="${esc(job.jdLink)}" target="_blank" class="btn btn-outline btn-sm" style="margin-bottom:6px;">查看原JD →</a><br>` : ''}
        <span style="font-size:11px;color:var(--text-muted);">创建: ${fmtFullDate(job.createdAt)}</span>
      </div>
    </div>
  </div></div>`;

  // Detail tabs
  html += `<div class="detail-tabs">
    <button class="detail-tab active" data-dtab="timeline" onclick="switchDetailTab('timeline')">求职进度</button>
    <button class="detail-tab" data-dtab="jd" onclick="switchDetailTab('jd')">岗位JD</button>
    <button class="detail-tab" data-dtab="match" onclick="switchDetailTab('match')">匹配分析</button>
    <button class="detail-tab" data-dtab="intro" onclick="switchDetailTab('intro')">自我介绍</button>
    <button class="detail-tab" data-dtab="suggestion" onclick="switchDetailTab('suggestion')">简历建议</button>
  </div>`;
  html += `<div id="detailTabContent"></div>`;

  document.getElementById('content').innerHTML = html;
  switchDetailTab('timeline');
}

function switchDetailTab(tab) {
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-dtab="${tab}"]`).classList.add('active');
  const job = state.jobs.find(j => j.id === state.currentJobId);
  if (!job) return;
  let html = '';
  switch(tab) {
    case 'timeline': html = renderTimelineTab(job); break;
    case 'jd': html = renderJDTab(job); break;
    case 'match': html = renderMatchTab(job); break;
    case 'intro': html = renderIntroTab(job); break;
    case 'suggestion': html = renderSuggestionTab(job); break;
  }
  document.getElementById('detailTabContent').innerHTML = html;
}

function renderTimelineTab(job) {
  const tl = job.timeline || [];
  if (tl.length === 0) {
    return `<div class="card"><div class="card-body empty-state" style="padding:40px;">
      <span class="icon">&#x1F4C5;</span><h3>暂无进度记录</h3>
      <p>点击右上角"更新状态"开始记录</p>
    </div></div>`;
  }
  let html = `<div class="card"><div class="card-body"><div class="timeline">`;
  tl.forEach((item, i) => {
    const isLast = i === tl.length - 1;
    html += `<div class="timeline-item ${isLast ? 'current' : 'past'}">
      <div class="tl-date">${fmtFullDate(item.date)}</div>
      <div class="tl-status">${STATUS_MAP[item.status]?.label || item.status}</div>
      ${item.note ? `<div class="tl-note">${esc(item.note)}</div>` : ''}
      ${item.nextStep ? `<div class="tl-note" style="color:var(--amber);font-weight:500;">→ 下一步: ${esc(item.nextStep)}</div>` : ''}
    </div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function renderJDTab(job) {
  if (!job.jd) {
    return `<div class="card"><div class="card-body empty-state" style="padding:40px;">
      <span class="icon">&#x1F4CB;</span><h3>未录入JD</h3><p>编辑岗位信息，粘贴岗位JD</p>
    </div></div>`;
  }
  return `<div class="card"><div class="card-body"><div class="jd-display">${esc(job.jd)}</div></div></div>`;
}

function renderMatchTab(job) {
  if (!job.matchResult) {
    return `<div class="card"><div class="card-body" style="text-align:center;padding:40px;">
      <p style="color:var(--text-muted);margin-bottom:12px;">尚未生成匹配分析</p>
      <button class="btn btn-primary btn-sm" onclick="runMatching('${job.id}')">生成匹配分析</button>
      <p style="font-size:11px;color:var(--text-muted);margin-top:8px;">需要录入简历和岗位JD</p>
    </div></div>`;
  }
  const mr = job.matchResult;
  let html = `<div class="card"><div class="card-header">
    <h3>匹配分析</h3>
    <button class="btn btn-outline btn-sm" onclick="runMatching('${job.id}')">重新分析</button>
  </div><div class="card-body">`;
  if (mr.summary) {
    html += `<p style="margin-bottom:14px;font-size:14px;color:var(--text-secondary);">${esc(mr.summary)}</p>`;
  }
  (mr.items || []).forEach(item => {
    html += `<div class="match-item ${item.type}">
      <div class="match-label">${item.type==='direct'?'直接匹配':item.type==='adjacent'?'邻近经验':'简历未体现'}</div>
      <div class="match-jd">${esc(item.jdReq)}</div>
      ${item.resumeEvidence ? `<div class="match-resume">简历: ${esc(item.resumeEvidence)}</div>` : ''}
      ${item.suggestion ? `<div class="match-suggestion">建议: ${esc(item.suggestion)}</div>` : ''}
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function renderIntroTab(job) {
  if (!job.selfIntro) {
    return `<div class="card"><div class="card-body" style="text-align:center;padding:40px;">
      <p style="color:var(--text-muted);margin-bottom:12px;">尚未生成自我介绍</p>
      <button class="btn btn-primary btn-sm" onclick="runSelfIntro('${job.id}')">生成 60 秒自我介绍</button>
      <p style="font-size:11px;color:var(--text-muted);margin-top:8px;">需要先完成匹配分析</p>
    </div></div>`;
  }
  return `<div class="card"><div class="card-header">
    <h3>60 秒自我介绍</h3>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline btn-sm" onclick="copyIntro('${job.id}')">复制</button>
      <button class="btn btn-outline btn-sm" onclick="runSelfIntro('${job.id}')">重新生成</button>
    </div>
  </div><div class="card-body"><div class="intro-block">${formatIntro(job.selfIntro)}</div></div></div>`;
}

function renderSuggestionTab(job) {

  const text = document.getElementById('resumeEditor').value;

  toast('简历已保存');
  renderResume();

async function uploadResume(event) {
  const input = event.target;
  const file = input.files?.[0];
  if (!file) return;
  const button = document.getElementById('resumeUploadButton');
  if (file.size > 8 * 1024 * 1024) {
    toast('简历文件不能超过 8MB', 'error');
    input.value = '';
    return;
  }
  button.disabled = true;
  button.textContent = '解析中…';
  try {
    const content = await fileToBase64(file);
    const response = await fetch('/api/parse-resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, content })
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '解析失败');
    state.resume = {
      text: result.data.text,
      filename: result.data.filename,
      updatedAt: now()
    };
    saveState();
    renderResume();
    toast(`已解析 ${result.data.filename}`);
  } catch (error) {
    toast(`上传失败：${error.message || '无法读取文件'}`, 'error');
    button.disabled = false;
    button.textContent = state.resume.filename ? '重新上传' : '选择文件';
  } finally {
    input.value = '';
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

function identifyCompetencies(jd) {
  const rules = [
    ['数据分析', /数据|指标|分析|SQL|度量|实验|归因/i],
    ['产品设计', /产品|需求|PRD|用户体验|功能设计|迭代/i],
    ['项目推进', /项目|推动|推进|落地|交付|协调|跟进/i],
    ['沟通协作', /沟通|协作|跨部门|团队|对接|合作/i],
    ['业务理解', /业务|商业|市场|客户|广告|增长|运营/i],
    ['问题解决', /问题|诊断|排查|解决|优化|策略/i],
    ['学习适应', /学习|自驱|适应|多任务|快速|探索/i],
    ['专业能力', /技术|开发|算法|模型|系统|平台|架构/i],
  ];
  const found = rules.filter(([, pattern]) => pattern.test(jd)).map(([name]) => name);
  ['沟通协作','问题解决','岗位专业能力'].forEach(name => {
    if (found.length < 4 && !found.includes(name)) found.push(name);
  });
  return found.slice(0, 6);
}

function extractResumeEvidence(resumeText, competencies) {
  const actionPattern = /负责|主导|推动|搭建|设计|开发|分析|优化|制定|协调|完成|实现|运营|审核|研究|交付|上线|解决|参与/;
  const metricPattern = /\d+(?:\.\d+)?\s*(?:%|％|倍|万|千|小时|天|个|项|人|条|次)|提升|降低|增长|节省|缩短/;
  const headerPattern = /^(教育经历|工作经历|实习经历|项目经历|技能|个人信息|自我评价|联系方式)[：:]?$/;
  const fragments = String(resumeText || '')
    .replace(/\r/g,'')
    .split(/\n+|(?<=[。；])/)
    .map(line => line.replace(/^[\s•·\-—*\d.、]+/,'').trim())
    .filter(line => line.length >= 16 && line.length <= 220 && !headerPattern.test(line));
  const scored = fragments.map((text,index) => {
    let score = 0;
    if (actionPattern.test(text)) score += 4;
    if (metricPattern.test(text)) score += 4;
    if (/项目|产品|业务|用户|团队|模型|系统|内容|策略|数据/.test(text)) score += 2;
    competencies.forEach(name => {
      const map = {
        数据分析: /数据|指标|分析|SQL|度量|实验/,
        产品设计: /产品|需求|PRD|用户|功能|迭代/,
        项目推进: /项目|推动|推进|落地|交付|协调/,
        沟通协作: /沟通|协作|跨部门|团队|对接/,
        业务理解: /业务|商业|市场|客户|广告|增长|运营/,
        问题解决: /问题|诊断|排查|解决|优化|策略/
      };
      if (map[name]?.test(text)) score += 1;
    });
    return { text, score, index };
  }).sort((a,b) => b.score - a.score || a.index - b.index);
  const unique = [];
  scored.forEach(item => {
    if (item.score > 0 && !unique.some(saved => saved.text.includes(item.text) || item.text.includes(saved.text))) unique.push(item);
  });
  return unique.slice(0, 6).map(item => item.text);
}

function inferEvidenceCompetency(evidence, competencies, index) {
  const rules = [
    ['数据分析', /数据|指标|分析|SQL|度量|实验/],
    ['产品设计', /产品|需求|PRD|用户|功能|迭代/],
    ['项目推进', /项目|推动|推进|落地|交付|协调|上线/],
    ['沟通协作', /沟通|协作|跨部门|团队|对接/],
    ['业务理解', /业务|商业|市场|客户|广告|增长|运营/],
    ['问题解决', /问题|诊断|排查|解决|优化|策略/]
  ];
  return rules.find(([name,pattern]) => competencies.includes(name) && pattern.test(evidence))?.[0]
    || competencies[index % competencies.length]
    || '岗位专业能力';
}

function buildReferenceAnswer(evidence, competency, job) {
  const metric = evidence.match(/(?:提升|降低|增长|节省|缩短)?[^，。；\n]{0,16}\d+(?:\.\d+)?\s*(?:%|％|倍|万|千|小时|天|个|项|人|条|次)/)?.[0];
  return `S｜情境：在“${evidence.slice(0,70)}${evidence.length>70?'…':''}”这段经历中，当时的业务背景是【补充项目阶段、团队和主要问题】。
T｜任务：我需要完成【补充你的明确目标】，同时满足【补充时间、资源或质量限制】。
A｜行动：围绕${competency}，我首先【补充判断依据】，随后${evidence}；过程中我重点解决了【补充最大难点】，并通过【补充协作对象或工具】推进落地。
R｜结果：${metric ? `最终取得了简历中写到的结果：${metric}。` : '最终结果是【补充效率、质量、规模或业务指标】。'}这段经历证明我具备${job.position}需要的${competency}能力。

提示：保留简历中的真实事实，把【】内容替换成你能被追问和验证的细节。`;
}

function generateInterviewKit(jobId) {
  const job = state.jobs.find(item => item.id === jobId);
  if (!job?.jd) { toast('请先补充岗位 JD', 'error'); return; }
  if (!state.resume.text) { toast('请先上传或粘贴简历', 'error'); navigate('resume'); return; }
  const competencies = identifyCompetencies(job.jd);
  const evidenceItems = extractResumeEvidence(state.resume.text, competencies);
  if (!evidenceItems.length) {
    toast('简历内容过少，建议补充具体项目、个人行动和结果', 'error');
    navigate('resume');
    return;
  }
  const questions = evidenceItems.map((evidence,index) => {
    const competency = inferEvidenceCompetency(evidence, competencies, index);
    return {
      id: uid(),
      competency,
      type: index < 4 ? '简历深挖' : '能力验证',
      source: '简历证据',
      status: 'draft',
      evidence,
      question: `你在简历中写到“${evidence.slice(0,88)}${evidence.length>88?'…':''}”。请具体说明这件事中你本人做出的关键判断和行动。`,
      probe: `追问：这段经历如何证明你的${competency}？如果重来一次，你会改变哪个决策？`,
      referenceAnswer: buildReferenceAnswer(evidence, competency, job)
    };
  });
  questions.push({
    id: uid(), competency: '求职动机', type: 'HR题',
    source: 'JD × 简历', status: 'draft',
    question: `为什么选择${job.company}的${job.position}岗位？`,
    probe: `追问：请从你的简历中选一段最能证明岗位匹配度的经历，并说明仍需补齐的能力。`,
    evidence: evidenceItems[0],
    referenceAnswer: `我选择${job.company}的${job.position}，不是只因为岗位名称，而是因为岗位要求与我的真实经历有三处连接。
第一，岗位看重${competencies[0] || '专业能力'}，我的简历中“${evidenceItems[0].slice(0,70)}${evidenceItems[0].length>70?'…':''}”可以作为直接证据。
第二，我还具备【从简历中选择另一项相关经历】，能够支持我快速进入工作状态。
第三，我目前仍需补齐【如实填写能力差距】，我已经通过【填写正在采取的学习或实践动作】进行准备。
因此，这份岗位既匹配我已有的能力，也符合我下一阶段希望深入发展的方向。`
  });
  job.interviewKit = {
    competencies,
    evidenceItems,
    questions,
    currentIndex: 0,
    answers: {},
    feedback: {},
    generatedAt: now()
  };
  saveState();
  toast('面试方案已生成');
  state.currentJobId = job.id;
  renderInterview();
}

      </div></div>
    </aside>
  </div>`;
}

function approveInterviewQuestion(jobId, questionId) {
  const job = state.jobs.find(item => item.id === jobId);
  const question = job?.interviewKit?.questions.find(item => item.id === questionId);
  if (!question) return;
  question.status = 'approved';
  question.approvedAt = now();
  saveState();
  toast('已纳入正式题库');
  renderInterview();
}

function submitInterviewAnswer(jobId) {
  const job = state.jobs.find(item => item.id === jobId);
  const kit = job?.interviewKit;
  const question = kit?.questions[kit.currentIndex || 0];
  const answer = document.getElementById('interviewAnswer')?.value.trim();
  if (!answer) { toast('请先输入你的回答', 'error'); return; }
  kit.answers[question.id] = answer;
  kit.feedback[question.id] = evaluateInterviewAnswer(answer);
  saveState();
  toast('回答已保存并完成点评');
  renderInterview();
}

function evaluateInterviewAnswer(answer) {
  const hasSituation = /当时|背景|项目|团队|负责|期间/.test(answer);
  const hasAction = /我(先|通过|负责|推动|设计|分析|协调|采取|完成)|我的做法/.test(answer);
  const hasResult = /结果|最终|提升|降低|增长|完成|上线|节省|%|％|倍/.test(answer);
  const lengthScore = answer.length >= 220 ? 1 : answer.length >= 100 ? .5 : 0;
  const rawScore = 1 + Number(hasSituation) * .5 + Number(hasAction) + Number(hasResult) + lengthScore;
  const score = Math.max(1, Math.min(4, Math.round(rawScore)));
  const strengths = [
    hasSituation ? '交代了案例背景' : '',
    hasAction ? '说明了个人行动' : '',
    hasResult ? '给出了结果或影响' : ''
  ].filter(Boolean);
  const improvements = [
    !hasSituation ? '补充事件发生的背景、目标和限制条件' : '',
    !hasAction ? '明确区分“团队做了什么”和“你本人做了什么”' : '',
    !hasResult ? '补充可验证的结果，优先使用效率、质量、规模或业务指标' : '',
    answer.length < 100 ? '增加关键决策和执行细节，避免只有结论' : ''
  ].filter(Boolean);
  const firstSentence = answer.split(/[。！？\n]/).find(Boolean)?.trim() || answer.slice(0,60);
  return {
    score,
    strengths: strengths.length ? strengths.join('；') : '回答与问题相关，已形成初步案例',
    improvements: improvements.length ? improvements.join('；') : '进一步压缩背景，把更多篇幅留给关键行动和量化结果',
    refined: `情境：${firstSentence}。\n任务：补充你当时必须完成的具体目标与限制。\n行动：用 2–3 个步骤说明你本人如何判断、推进和解决问题。\n结果：补充最终产出、量化变化或他人反馈，并说明你的复盘。`
  };
}

function renderCoachFeedback(feedback) {
  return `<div class="coach-feedback">
    <h4>本题评分：${feedback.score} / 4</h4>
    <p><strong>做得好的地方：</strong>${esc(feedback.strengths)}</p>
    <h4>可以改进</h4><p>${esc(feedback.improvements)}</p>
    <h4>STAR 改写框架</h4><p>${esc(feedback.refined)}</p>
  </div>`;
}

function moveInterviewQuestion(jobId, step) {
  const job = state.jobs.find(item => item.id === jobId);
  if (!job?.interviewKit) return;
  const draft = document.getElementById('interviewAnswer')?.value.trim();
  const current = job.interviewKit.questions[job.interviewKit.currentIndex || 0];
  if (draft) job.interviewKit.answers[current.id] = draft;
  job.interviewKit.currentIndex = Math.max(0, Math.min(job.interviewKit.questions.length - 1, (job.interviewKit.currentIndex || 0) + step));
  saveState();
  renderInterview();
}

function jumpInterviewQuestion(jobId, index) {
  const job = state.jobs.find(item => item.id === jobId);
  if (!job?.interviewKit) return;
  const draft = document.getElementById('interviewAnswer')?.value.trim();
  const current = job.interviewKit.questions[job.interviewKit.currentIndex || 0];
  if (draft) job.interviewKit.answers[current.id] = draft;
  job.interviewKit.currentIndex = index;
  saveState();
  renderInterview();
}

// ========== Data Export/Import ==========
function exportData() {
  const data = { resume: state.resume, jobs: state.jobs, exportedAt: now() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `offerflow-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.jobs || !Array.isArray(data.jobs)) throw new Error('Invalid format');
      state.resume = data.resume || { text: '', updatedAt: null };
      state.jobs = data.jobs;
      saveState();
      toast('数据已导入，共 ' + state.jobs.length + ' 个岗位');
      render();
    } catch(err) {
      toast('导入失败：文件格式不正确', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function confirmClearData() {
  showConfirm('确认清除所有数据？', '此操作不可撤销。建议先导出备份。', () => {
    state.resume = { text: '', updatedAt: null };
    state.jobs = [];
    saveState();
    toast('所有数据已清除');
    navigate('list');
  });
}

// ========== Job Link Parsing ==========
async function parseJobLink(overlay) {
  const linkInput = overlay.querySelector('#fLink');
  const button = overlay.querySelector('#parseJobLink');
  const status = overlay.querySelector('#parseStatus');
  const rawUrl = linkInput.value.trim();

  let url;
  try {
    url = new URL(rawUrl);
    if (!['http:', 'https:'].includes(url.protocol)) throw new Error('协议不支持');
  } catch (e) {
    setParseStatus(status, 'error', '请输入完整的 http 或 https 招聘链接。');
    linkInput.focus();
    return;
  }

  button.disabled = true;
  button.textContent = '解析中…';
  setParseStatus(status, 'loading', '正在读取招聘页面并识别岗位信息…');

  try {
    const parsed = await fetchJobData(url.href);
    const filled = [];

    if (parsed.company) {
      overlay.querySelector('#fCompany').value = parsed.company;
      filled.push('公司');
    }
    if (parsed.position) {
      overlay.querySelector('#fPosition').value = parsed.position;
      filled.push('岗位名称');
    }
    if (parsed.jd) {
      overlay.querySelector('#fJD').value = parsed.jd;
      filled.push('JD');
    }
    if (parsed.location) {
      overlay.querySelector('#fLocation').value = parsed.location;
      filled.push('工作地点');
    }
    const channel = inferChannel(url.hostname);
    if (channel) overlay.querySelector('#fChannel').value = channel;

    if (!filled.length) {
      throw new Error('页面中没有识别到公开的岗位字段');
    }
    const methodText = parsed.parseMethod === 'browser' ? '浏览器渲染' : '快速解析';
    setParseStatus(status, 'success', `已通过${methodText}填写：${filled.join('、')}。请核对后保存。`);
    toast('岗位信息解析完成');
  } catch (error) {
    setParseStatus(
      status,
      'error',
      `暂时无法自动读取这个页面：${error.message || '网站限制访问'}。链接已保留，你可以手动填写其余字段。`
    );
  } finally {
    button.disabled = false;
    button.textContent = '一键解析';
  }
}

function setParseStatus(element, type, message) {
  element.className = `parse-status ${type}`;
  element.textContent = message;
}

async function fetchJobData(url) {
  if (location.protocol === 'file:') {
    throw new Error('请先启动 OfferFlow 本地服务，再从 http://127.0.0.1:8765 打开网页');
  }
  let response;
  try {
    response = await fetch('/api/parse-job', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
  } catch (error) {
    throw new Error('无法连接本地解析服务，请确认服务已经启动');
  }
  let result;
  try {
    result = await response.json();
  } catch (error) {
    throw new Error('本地解析服务返回了无法识别的内容');
  }
  if (!response.ok || !result.ok) {
    throw new Error(result.error || `解析服务返回 ${response.status}`);
  }
  return result.data;
}

function extractJobPosting(html, sourceUrl) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const jobPosting = findJobPostingJsonLd(doc);

  let position = cleanText(jobPosting?.title);
  let company = cleanText(
    typeof jobPosting?.hiringOrganization === 'string'
      ? jobPosting.hiringOrganization
      : jobPosting?.hiringOrganization?.name
  );
  let location = extractStructuredLocation(jobPosting?.jobLocation);
  let jd = htmlToPlainText(jobPosting?.description || jobPosting?.responsibilities || '');

  if (!position) {
    position = getMetaContent(doc, ['meta[property="og:title"]', 'meta[name="twitter:title"]'])
      || cleanText(doc.querySelector('h1')?.textContent)
      || cleanPageTitle(doc.title);
  }
  if (!company) {
    company = getMetaContent(doc, [
      'meta[property="og:site_name"]',
      'meta[name="application-name"]',
      'meta[name="author"]'
    ]);
  }
  if (!location) {
    location = findTextByLabels(doc.body?.innerText || '', ['工作地点', '工作地址', '办公地点', '职位地点', '地点', 'Location']);
  }
  if (!jd) {
    jd = extractLikelyDescription(doc);
  }

  const hostCompany = inferCompanyFromHost(new URL(sourceUrl).hostname);
  if (!company && hostCompany) company = hostCompany;

  return {
    company: trimField(company, 80),
    position: trimField(position, 120),
    location: trimField(location, 120),
    jd: trimField(jd, 12000)
  };
}

function findJobPostingJsonLd(doc) {
  const scripts = [...doc.querySelectorAll('script[type="application/ld+json"]')];
  for (const script of scripts) {
    try {
      const data = JSON.parse(script.textContent.trim());
      const candidates = Array.isArray(data) ? data : [data];
      for (const candidate of candidates) {
        const nodes = candidate?.['@graph'] ? candidate['@graph'] : [candidate];
        const match = nodes.find(node => {
          const type = node?.['@type'];
          return type === 'JobPosting' || (Array.isArray(type) && type.includes('JobPosting'));
        });
        if (match) return match;
      }
    } catch (e) {}
  }
  return null;
}

function extractStructuredLocation(value) {
  const locations = Array.isArray(value) ? value : value ? [value] : [];
  return locations.map(item => {
    if (typeof item === 'string') return item;
    const address = item?.address || item;
    if (typeof address === 'string') return address;
    return [
      address?.addressRegion,
      address?.addressLocality,
      address?.streetAddress
    ].filter(Boolean).join(' · ');
  }).filter(Boolean).join(' / ');
}

function extractLikelyDescription(doc) {
  const selectors = [
    '[class*="job-description"]', '[class*="jobDescription"]', '[class*="job-detail"]',
    '[class*="jobDetail"]', '[class*="description"]', '[id*="job-description"]',
    '[id*="jobDescription"]', 'article', 'main'
  ];
  const candidates = selectors.flatMap(selector => [...doc.querySelectorAll(selector)])
    .map(el => cleanText(el.innerText))
    .filter(text => text && text.length > 120)
    .sort((a, b) => b.length - a.length);
  return candidates[0]?.slice(0, 12000) || '';
}

function getMetaContent(doc, selectors) {
  for (const selector of selectors) {
    const value = cleanText(doc.querySelector(selector)?.getAttribute('content'));
    if (value) return value;
  }
  return '';
}

function findTextByLabels(text, labels) {
  const normalized = String(text || '').replace(/\r/g, '');
  for (const label of labels) {
    const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const match = normalized.match(new RegExp(`${escaped}\\s*[：:]?\\s*([^\\n]{2,100})`, 'i'));
    if (match) return cleanText(match[1]);
  }
  return '';
}

function cleanPageTitle(value) {
  return cleanText(value).split(/\s[-_|｜]\s/)[0];
}

function htmlToPlainText(value) {
  if (!value) return '';
  const temp = document.createElement('div');
  temp.innerHTML = value;
  temp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
  temp.querySelectorAll('p,li,h1,h2,h3,h4').forEach(el => el.append('\n'));
  return cleanText(temp.textContent).replace(/\n\s*\n+/g, '\n');
}

function cleanText(value) {
  return String(value || '').replace(/\u00a0/g, ' ').replace(/[ \t]+/g, ' ').trim();
}

function trimField(value, maxLength) {
  return cleanText(value).slice(0, maxLength);
}

function inferChannel(hostname) {
  const host = hostname.toLowerCase();
  if (host.includes('zhipin.com')) return 'Boss直聘';
  if (host.includes('liepin.com')) return '猎头';
  return '官网';
}

function inferCompanyFromHost(hostname) {
  const generic = ['zhipin', 'liepin', 'linkedin', 'jobs', 'job', 'career', 'careers', 'recruit'];
  const parts = hostname.replace(/^www\./, '').split('.');
  const candidate = parts.find(part => part.length > 2 && !generic.includes(part.toLowerCase()));
  return candidate ? candidate.replace(/[-_]/g, ' ') : '';
}

    <div class="modal-body">
      <div class="form-group"><label>新状态</label>
        <select class="form-select" id="fStatus">
          ${STATUS_ORDER.map(s => `<option value="${s}" ${job.status===s?'selected':''}>${STATUS_MAP[s].label}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>进展说明</label><textarea class="form-textarea" id="fNote" placeholder="例如: 收到面试邀请..." style="min-height:60px;"></textarea></div>
      <div class="form-group"><label>下一步事项</label><input class="form-input" id="fNextStep" placeholder="例如: 准备面试材料"></div>
      <div class="form-group"><label>下一次关键时间</label><input class="form-input" type="date" id="fNextDate"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalSave">更新</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('#modalClose').onclick = close;
  overlay.querySelector('#modalCancel').onclick = close;
  overlay.onclick = (e) => { if(e.target===overlay) close(); };

  overlay.querySelector('#modalSave').onclick = () => {
    const newStatus = overlay.querySelector('#fStatus').value;
    const note = overlay.querySelector('#fNote').value.trim();
    const nextStep = overlay.querySelector('#fNextStep').value.trim();
    const nextDate = overlay.querySelector('#fNextDate').value;

    if (!job.timeline) job.timeline = [];
    job.timeline.push({
      date: now(),
      status: newStatus,
      note: note || '',
      nextStep: nextStep || '',
      nextDate: nextDate || '',
    });
    job.status = newStatus;
    job.updatedAt = now();
    saveState();
    close();
    toast('状态已更新');
    renderDetail();
  };
}

// ========== Delete Job ==========
function confirmDeleteJob(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  showConfirm(`删除「${job.company} · ${job.position}」？`, '所有记录和进度将被删除，不可恢复。', () => {
    state.jobs = state.jobs.filter(j => j.id !== jobId);
    saveState();
    toast('已删除');
    navigate('list');
  });
}

// ========== AI Matching (Mock) ==========
function runMatching(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  if (!state.resume.text) { toast('请先在"我的简历"中录入简历', 'error'); return; }
  if (!job.jd) { toast('请先录入岗位JD', 'error'); return; }

  // Extract keywords from JD
  const jdKeywords = extractKeywords(job.jd);
  const resumeLower = state.resume.text.toLowerCase();

  const items = jdKeywords.map(kw => {
    const found = resumeLower.includes(kw.toLowerCase());
    if (found) {
      // Try to find context
      const idx = resumeLower.indexOf(kw.toLowerCase());
      const start = Math.max(0, idx - 30);
      const end = Math.min(resumeLower.length, idx + kw.length + 50);
      const ctx = state.resume.text.slice(start, end).replace(/\n/g,' ').trim();
      return {
        type: 'direct',
        jdReq: kw,
        resumeEvidence: '...' + ctx + '...',
        suggestion: '简历中已体现该能力，建议在表达上更贴近JD措辞',
      };
    } else {
      // Check partial match
      const partial = kw.split(/[\s\/、，,]+/).some(w => w.length > 1 && resumeLower.includes(w.toLowerCase()));
      if (partial) {
        return {
          type: 'adjacent',
          jdReq: kw,
          resumeEvidence: null,
          suggestion: '简历中有相关方向的经验，但未明确体现该关键词。建议在相关经历中补充该能力的具体描述',
        };
      }
      return {
        type: 'missing',
        jdReq: kw,
        resumeEvidence: null,
        suggestion: '当前简历中未找到相关证据。如果你有相关经验，请在简历中补充；如果没有，可在面试中诚实说明并展示学习能力',
      };
    }
  });

  const directCount = items.filter(i=>i.type==='direct').length;
  const summary = `共提取 ${items.length} 项JD关键要求，其中 ${directCount} 项在简历中有直接证据，${items.filter(i=>i.type==='adjacent').length} 项有邻近经验，${items.filter(i=>i.type==='missing').length} 项简历未体现。`;

  job.matchResult = { items, summary, generatedAt: now() };
  saveState();
  toast('匹配分析完成');
  switchDetailTab('match');
}

function extractKeywords(jd) {
  // Simple keyword extraction from JD
  const lines = jd.split(/[\n\r]+/).filter(l => l.trim());
  const keywords = [];
  const patterns = [
    /(?:要求|必须|具备|熟悉|掌握|精通|了解|负责|参与|主导|设计|推动|分析|优化|管理|制定|撰写|输出|搭建|建设|落地|迭代|跟进|协调|沟通|对接|支持|协助|独立|完成)[^，。；\n]{4,40}/g,
    /(?:有|具有|拥有|具备|具备有)\s*[^，。；\n]{3,30}(?:经验|能力|背景|优先)/g,
    /(?:本科|硕士|博士|学历)[^，。；\n]{3,20}/g,
    /[A-Za-z+#]+(?:\.js|\.ts|\.py|\.go|\.java)?/g,
    /(?:产品|运营|增长|数据|技术|设计|策略|算法|模型|平台|系统|工具|方案|流程|规范|文档|报告|分析|评估|测试|开发|架构|部署|监控|治理|审核|风控|合规|商业化|用户|体验|交互|视觉|品牌|营销|活动|渠道|转化|留存|拉新|促活|变现|定价|预算|供应商|合作伙伴|团队|跨部门|项目管理|需求分析|竞品|PRD|MRD|OKR|KPI|ROI|DAU|MAU|GMV|ARPU|LTV|CAC|NPS|CSAT)[^，。；\n]{0,20}/g,
  ];
  const seen = new Set();
  patterns.forEach(re => {
    let m;
    while ((m = re.exec(jd)) !== null) {
      const kw = m[0].trim();
      if (kw.length >= 2 && kw.length <= 60 && !seen.has(kw)) {
        seen.add(kw);
        keywords.push(kw);
      }
    }
  });
  return keywords.slice(0, 20);
}

// ========== Self Intro (Mock) ==========
function runSelfIntro(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  if (!state.resume.text) { toast('请先在"我的简历"中录入简历', 'error'); return; }
  if (!job.matchResult) { toast('请先生成匹配分析', 'error'); return; }

  const matchItems = job.matchResult.items || [];
  const directMatches = matchItems.filter(i => i.type === 'direct');

  const intro = `面试官你好，我是${extractName() || 'XXX'}，${extractEducation() || 'XX学历'}，目前正在寻找${job.position}方向的机会。

在过去的工作中，我${directMatches.length > 0 ? '有' + directMatches.length + '项经历与这个岗位直接相关。' : '积累了一些与这个岗位相关的经验。'}

${directMatches.slice(0, 2).map((m,i) => `第${i+1}，关于"${m.jdReq.slice(0,30)}"，我在${i===0?'上一段':'另一段'}经历中${m.resumeEvidence ? '有具体实践' : '有所涉及'}。`).join('\n\n')}

我相信这些经历让我能够胜任${job.position}的工作。我对${job.company}在${job.jd ? job.jd.slice(0,60).replace(/\n/g,' ') : '这个领域'}非常感兴趣，期待有机会加入团队。`;

  job.selfIntro = intro;
  saveState();
  toast('自我介绍已生成');
  switchDetailTab('intro');
}

function extractName() {
  const m = state.resume.text.match(/(?:姓名|名字)[：:]\s*(\S{1,6})/);
  return m ? m[1] : null;
}
function extractEducation() {
  const m = state.resume.text.match(/(?:本科|硕士|博士|学历)[：:]?\s*(\S{2,20})/);
  return m ? m[0] : '相关学历';
}

// ========== Resume Suggestion (Mock) ==========
function runResumeSuggestion(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  if (!state.resume.text) { toast('请先在"我的简历"中录入简历', 'error'); return; }
  if (!job.matchResult) { toast('请先生成匹配分析', 'error'); return; }

  const matchItems = job.matchResult.items || [];
  const adjacentMissing = matchItems.filter(i => i.type === 'adjacent' || i.type === 'missing');

  const suggestions = adjacentMissing.slice(0, 5).map(item => ({
    original: `简历中缺少与"${item.jdReq}"相关的明确描述`,
    suggested: `建议在相关经历中补充: 如何运用${item.jdReq.slice(0,20)}解决具体问题，以及带来的结果或影响`,
    reason: `JD明确要求${item.jdReq}，当前简历中未找到直接证据。如你确实有相关经验，请用具体事例体现`,
  }));

  job.resumeSuggestion = suggestions;
  saveState();
  toast('修改建议已生成');
  switchDetailTab('suggestion');
}

function copyIntro(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job || !job.selfIntro) return;
  navigator.clipboard.writeText(job.selfIntro).then(() => toast('已复制到剪贴板')).catch(() => toast('复制失败', 'error'));
}

// ========== Helpers ==========
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ========== Init ==========
loadState();
render();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    if (state.currentView === 'list') openJobModal();
  }
  if (e.key === 'Escape') {
    const modals = document.querySelectorAll('.modal-overlay, .confirm-overlay');
    if (modals.length > 0) modals[modals.length-1].remove();
  }
});
</script>
