<!-- Generated by Trae Work -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="使用合成数据演示批次切换、证据查看与打标保存。">
  <title>交互演示 — Case Review Tool</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/demo.js" defer></script>
</head>
<body class="demo-page">
  <header class="demo-header">
    <a class="wordmark" href="./index.html"><span class="wordmark-mark" aria-hidden="true">CR</span><span>Review Desk</span></a>
    <p class="synthetic-badge"><span aria-hidden="true"></span> 合成数据演示</p>
    <a class="back-link" href="./index.html">返回作品集</a>
  </header>

  <main class="review-app">
    <aside class="batch-panel" aria-labelledby="batch-title">
      <div class="panel-label">
        <div><p>工作队列</p><h1 id="batch-title">选择批次</h1></div>
        <button class="icon-button" id="reset-demo" type="button" title="重置本地演示数据" aria-label="重置本地演示数据">↺</button>
      </div>
      <div id="batch-list" class="batch-list" role="list"></div>
      <div class="local-note">
        <span aria-hidden="true">◈</span>
        <p><strong>仅在本机保存</strong><br>演示标签存放在浏览器本地。</p>
      </div>
    </aside>

    <section class="case-panel" aria-labelledby="case-title">
      <div class="case-toolbar">
        <div>
          <p class="case-kicker" id="case-kicker">正在载入</p>
          <h2 id="case-title">—</h2>
        </div>
        <div class="case-nav" aria-label="案例切换">
          <button id="prev-case" class="icon-button" type="button" aria-label="上一条">←</button>
          <span id="case-position">0 / 0</span>
          <button id="next-case" class="icon-button" type="button" aria-label="下一条">→</button>
        </div>
      </div>

      <article class="case-document">
        <div class="meta-row" id="case-meta"></div>
        <section class="summary-block" aria-labelledby="summary-title">
          <p class="section-caption" id="summary-title">内容摘要</p>
          <p id="case-summary"></p>
        </section>
        <section class="evidence-section" aria-labelledby="evidence-title">
          <div class="evidence-heading">
            <div><p class="section-caption">Evidence rail</p><h3 id="evidence-title">证据序列</h3></div>
            <span id="evidence-count">0 项</span>
          </div>
          <div id="evidence-list" class="evidence-list"></div>
        </section>
      </article>
    </section>

    <aside class="label-panel" aria-labelledby="label-title">
      <div class="label-top">
        <p class="section-caption">Decision</p>
        <h2 id="label-title">记录复核结论</h2>
        <p>选择最符合当前证据的判断。</p>
      </div>
      <form id="label-form">
        <fieldset>
          <legend>复核标签</legend>
          <label class="decision-option"><input type="radio" name="decision" value="通过"><span><b>通过</b><small>证据支持当前结论</small></span><i>✓</i></label>
          <label class="decision-option"><input type="radio" name="decision" value="需补充"><span><b>需补充</b><small>信息不足，暂不判断</small></span><i>＋</i></label>
          <label class="decision-option"><input type="radio" name="decision" value="不通过"><span><b>不通过</b><small>证据与结论不一致</small></span><i>×</i></label>
        </fieldset>
        <fieldset>
          <legend>置信度</legend>
          <div class="confidence-options">
            <label><input type="radio" name="confidence" value="低"><span>低</span></label>
            <label><input type="radio" name="confidence" value="中"><span>中</span></label>
            <label><input type="radio" name="confidence" value="高"><span>高</span></label>
          </div>
        </fieldset>
        <label class="note-field" for="review-note"><span>备注 <small>可选</small></span><textarea id="review-note" rows="3" maxlength="120" placeholder="补充判断依据…"></textarea><small><span id="note-count">0</span>/120</small></label>
        <button class="button button-primary save-button" type="submit">保存并查看下一条 <span aria-hidden="true">→</span></button>
        <p class="saved-state" id="saved-state" aria-live="polite"></p>
      </form>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">已保存到本地演示</div>
</body>
</html>
